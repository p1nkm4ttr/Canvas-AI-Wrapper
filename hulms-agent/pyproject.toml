[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hulms-agent"
version = "1.11.0"
description = "Personal Canvas MCP server for Habib University (fork of vishalsachdev/canvas-mcp, stripped to the single-user student surface)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.7,<4",
    "mcp>=1.26.0,<2",
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.2.2,<2",
    "pydantic>=2.13.1,<3",
    "python-dateutil>=2.9.0,<3",
    "tzdata; platform_system == 'Windows'",
    "pypdf>=6.0,<7",
    "python-pptx>=1.0,<2",
    "python-docx>=1.1,<2",
    "pillow>=10.0",
]

[project.scripts]
hulms-server = "canvas_mcp.server:main"
hulms-audit = "canvas_mcp.audit:main"
hulms-agenda = "canvas_mcp.agenda:main"
hulms-extract = "canvas_mcp.extract_cli:main"
hulms-courses = "canvas_mcp.courses_cli:main"
hulms-ics = "canvas_mcp.ics_cli:main"
hulms-brief = "canvas_mcp.brief_cli:main"
hulms-backup = "canvas_mcp.backup_cli:main"

[tool.hatch.version]
path = "src/canvas_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
]
